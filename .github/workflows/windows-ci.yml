name: Windows regression tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.11.1'
          architecture: x64
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.5'
          architecture: x64
      - name: Install Python dependencies
        # The lock omits unused Windows automation extras declared by wechatauto-replica.
        run: python -m pip install --no-deps --requirement python-requirements.lock.txt
      - name: Install Node.js dependencies
        run: npm.cmd ci --no-audit --no-fund
      - name: Run synthetic regression tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm.cmd test
